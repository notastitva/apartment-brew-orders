        <text x="125" y="160" font-family="'DejaVu Sans', sans-serif" font-size="7.5" fill="#2E2A27" text-anchor="middle">Never scale axes independently.</text>
    </g>
    
    <g transform="translate(620, 410)">
        <rect width="250" height="180" rx="6" fill="#F2ECE1"/>
        <text x="125" y="25" font-family="'DejaVu Sans', sans-serif" font-size="10.5" font-weight="bold" fill="#D64045" text-anchor="middle">✗ DON'T: Violate Clear Space</text>
        <path d="M 99.1 134.9 L 150.9 134.9 L 150.9 89.9 L 125.0 56.1 L 99.1 89.9 Z" fill="none" stroke="#181311" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="rotate(-3 125 112.375)">
            <ellipse cx="125.0" cy="112.4" rx="10.3" ry="14.0" fill="none" stroke="#181311" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M 125.0 100.5 C 127.5 107.5, 122.5 119.3, 125.0 124.2" fill="none" stroke="#181311" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <text x="125" y="100" font-family="'DejaVu Sans', sans-serif" font-size="7" font-weight="bold" fill="#D64045" text-anchor="middle">TEXT OVERLAPPING</text>
        <line x1="20" y1="40" x2="230" y2="150" stroke="#D64045" stroke-width="2"/>
        <text x="125" y="160" font-family="'DejaVu Sans', sans-serif" font-size="7.5" fill="#2E2A27" text-anchor="middle">Preserve ≥ 0.5X margin around logo.</text>
    </g>
    
    <g transform="translate(900, 410)">
        <rect width="250" height="180" rx="6" fill="#F2ECE1"/>
        <text x="125" y="25" font-family="'DejaVu Sans', sans-serif" font-size="10.5" font-weight="bold" fill="#D64045" text-anchor="middle">✗ DON'T: Unapproved Colors</text>
        <path d="M 24.1 139.9 L 75.9 139.9 L 75.9 94.9 L 50.0 61.1 L 24.1 94.9 Z" fill="none" stroke="#00F5D4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="rotate(-3 50 117.375)">
            <ellipse cx="50.0" cy="117.4" rx="10.3" ry="14.0" fill="none" stroke="#00F5D4" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M 50.0 105.5 C 52.5 112.5, 47.5 124.3, 50.0 129.2" fill="none" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <text x="100" y="95" font-family="'DejaVu Sans', sans-serif" font-size="8" font-weight="bold" fill="#FF007F">APARTMENT</text>
        <line x1="20" y1="40" x2="230" y2="150" stroke="#D64045" stroke-width="2"/>
        <text x="125" y="160" font-family="'DejaVu Sans', sans-serif" font-size="7.5" fill="#2E2A27" text-anchor="middle">Do not use neon or unapproved tones.</text>
    </g>
    
    <!-- Color Swatches Footer -->
    <rect x="40" y="680" width="1120" height="190" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1.2"/>
