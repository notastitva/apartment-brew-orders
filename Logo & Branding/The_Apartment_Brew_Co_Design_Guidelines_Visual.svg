    <line x1="40" y1="90" x2="1160" y2="90" stroke="#181311" stroke-width="1.5" stroke-opacity="0.2"/>
    
    <!-- Primary Lockup Box -->
    <rect x="40" y="110" width="730" height="230" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1.2"/>
    <path d="M 95.4 298.6 L 204.6 298.6 L 204.6 203.6 L 150.0 132.4 L 95.4 203.6 Z" fill="none" stroke="#181311" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-3 150 251.125)">
        <ellipse cx="150.0" cy="251.1" rx="21.8" ry="29.4" fill="none" stroke="#181311" stroke-width="3.3" stroke-linecap="round"/>
        <path d="M 150.0 226.1 C 155.2 240.8, 144.8 265.9, 150.0 276.2" fill="none" stroke="#181311" stroke-width="3.1" stroke-linecap="round"/>
    </g>
    <line x1="240" y1="150" x2="240" y2="300" stroke="#C4884D" stroke-width="2"/>
    <text x="265" y="200" font-family="'DejaVu Sans', sans-serif" font-size="26" font-weight="bold" fill="#181311" letter-spacing="3">THE APARTMENT</text>
    <text x="265" y="235" font-family="'DejaVu Sans', sans-serif" font-size="20" fill="#C4884D" letter-spacing="4">BREW CO.</text>
    <text x="265" y="265" font-family="'DejaVu Sans', sans-serif" font-size="9" fill="#181311" fill-opacity="0.85" letter-spacing="1.5">FLASH-CHILLED &amp; CRAFT SPECIALTY COFFEE</text>
    <text x="265" y="285" font-family="'DejaVu Sans', sans-serif" font-size="8.5" font-weight="bold" fill="#9E472A" letter-spacing="1.5">EST. 2026 • GURUGRAM</text>
    <text x="750" y="325" font-family="'DejaVu Sans', sans-serif" font-size="8" font-weight="bold" fill="#2E2A27" fill-opacity="0.6" text-anchor="end">PRIMARY STANDARD LOCKUP (DIMENSIONS: 14 : 5.5)</text>
    
    <!-- Typography Box -->
    <rect x="790" y="110" width="370" height="230" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1.2"/>
    <text x="810" y="140" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#181311">TYPOGRAPHY HIERARCHY</text>
    <text x="810" y="165" font-family="'DejaVu Sans', sans-serif" font-size="9.5" fill="#2E2A27">
        <tspan x="810" dy="0" font-weight="bold" fill="#181311">• Wordmark: "THE APARTMENT"</tspan>
        <tspan x="810" dy="16">  Geometric Sans Bold | Track: +200 | All Caps</tspan>
        <tspan x="810" dy="18" font-weight="bold" fill="#C4884D">• Wordmark: "BREW CO."</tspan>
        <tspan x="810" dy="16">  Geometric Sans Regular | Track: +350 | All Caps</tspan>
        <tspan x="810" dy="18" font-weight="bold" fill="#181311">• Subtext: "MICRO-BATCH SPECIALTY"</tspan>
        <tspan x="810" dy="16">  Modern Clean Sans | Track: +150 | All Caps</tspan>
    </text>
    
    <!-- Do's & Don'ts Box -->
    <rect x="40" y="360" width="1120" height="300" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1.2"/>
    <text x="60" y="390" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#181311">BRAND INTEGRITY: USAGE RULES (DO'S &amp; DON'TS)</text>
    
    <g transform="translate(60, 410)">
        <rect width="250" height="180" rx="6" fill="#F2ECE1"/>
        <text x="125" y="25" font-family="'DejaVu Sans', sans-serif" font-size="10.5" font-weight="bold" fill="#2A9D8F" text-anchor="middle">✓ DO: Keep Standard Lockup</text>
        <path d="M 24.1 139.9 L 75.9 139.9 L 75.9 94.9 L 50.0 61.1 L 24.1 94.9 Z" fill="none" stroke="#181311" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="rotate(-3 50 117.375)">
            <ellipse cx="50.0" cy="117.4" rx="10.3" ry="14.0" fill="none" stroke="#181311" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M 50.0 105.5 C 52.5 112.5, 47.5 124.3, 50.0 129.2" fill="none" stroke="#181311" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <text x="100" y="95" font-family="'DejaVu Sans', sans-serif" font-size="8" font-weight="bold" fill="#181311">APARTMENT</text>
        <text x="100" y="110" font-family="'DejaVu Sans', sans-serif" font-size="6.5" fill="#C4884D">BREW CO.</text>
        <text x="125" y="160" font-family="'DejaVu Sans', sans-serif" font-size="7.5" fill="#2E2A27" text-anchor="middle">Maintain 14:5.5 standard aspect ratio.</text>
    </g>
    
    <g transform="translate(340, 410)">
        <rect width="250" height="180" rx="6" fill="#F2ECE1"/>
        <text x="125" y="25" font-family="'DejaVu Sans', sans-serif" font-size="10.5" font-weight="bold" fill="#D64045" text-anchor="middle">✗ DON'T: Stretch / Distort</text>
        <path d="M 32.8 128.2 L 67.2 128.2 L 67.2 98.2 L 50.0 75.8 L 32.8 98.2 Z" fill="none" stroke="#D64045" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="rotate(-3 50 113.25)">
            <ellipse cx="50.0" cy="113.2" rx="6.9" ry="9.3" fill="none" stroke="#D64045" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M 50.0 105.3 C 51.6 110.0, 48.4 117.9, 50.0 121.2" fill="none" stroke="#D64045" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <text x="100" y="95" font-family="'DejaVu Sans', sans-serif" font-size="6" font-weight="bold" fill="#D64045">APARTMENT</text>
