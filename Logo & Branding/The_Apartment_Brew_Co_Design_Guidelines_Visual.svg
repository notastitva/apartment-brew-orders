    <text x="75" y="765" font-family="'DejaVu Sans', sans-serif" font-size="9" fill="#FFFFFF">HEX: #181311 | RGB: 24, 19, 17</text>
    <text x="75" y="780" font-family="'DejaVu Sans', sans-serif" font-size="8.5" fill="#FFFFFF" fill-opacity="0.9">CMYK: 68, 68, 67, 85</text>
    <text x="75" y="800" font-family="'DejaVu Sans', sans-serif" font-size="8" fill="#FFFFFF" fill-opacity="0.8">Primary Text &amp; Lineart</text>
    
    <rect x="340" y="720" width="250" height="135" rx="6" fill="#FAF6EE" stroke="#181311" stroke-width="1"/>
    <text x="355" y="745" font-family="'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#181311">Warm Oat Cream</text>
    <text x="355" y="765" font-family="'DejaVu Sans', sans-serif" font-size="9" fill="#181311">HEX: #FAF6EE | RGB: 250, 246, 238</text>
    <text x="355" y="780" font-family="'DejaVu Sans', sans-serif" font-size="8.5" fill="#181311">CMYK: 2, 2, 6, 0</text>
    <text x="355" y="800" font-family="'DejaVu Sans', sans-serif" font-size="8" fill="#181311" fill-opacity="0.8">Base Background &amp; Labels</text>
    
    <rect x="620" y="720" width="250" height="135" rx="6" fill="#C4884D"/>
    <text x="635" y="745" font-family="'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Roast Amber</text>
    <text x="635" y="765" font-family="'DejaVu Sans', sans-serif" font-size="9" fill="#FFFFFF">HEX: #C4884D | RGB: 196, 136, 77</text>
    <text x="635" y="780" font-family="'DejaVu Sans', sans-serif" font-size="8.5" fill="#FFFFFF" fill-opacity="0.9">CMYK: 22, 48, 82, 4</text>
    <text x="635" y="800" font-family="'DejaVu Sans', sans-serif" font-size="8" fill="#FFFFFF" fill-opacity="0.8">Secondary Lockup &amp; Accent</text>
    
    <rect x="900" y="720" width="250" height="135" rx="6" fill="#9E472A"/>
    <text x="915" y="745" font-family="'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Specialty Terracotta</text>
    <text x="915" y="765" font-family="'DejaVu Sans', sans-serif" font-size="9" fill="#FFFFFF">HEX: #9E472A | RGB: 158, 71, 42</text>
    <text x="915" y="780" font-family="'DejaVu Sans', sans-serif" font-size="8.5" fill="#FFFFFF" fill-opacity="0.9">CMYK: 24, 78, 90, 18</text>
    <text x="915" y="800" font-family="'DejaVu Sans', sans-serif" font-size="8" fill="#FFFFFF" fill-opacity="0.8">Origin Tags &amp; Roast Details</text>
</svg>