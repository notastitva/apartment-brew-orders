<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <rect width="1200" height="800" fill="#F2ECE1"/>
    <!-- Header -->
    <text x="40" y="50" font-family="'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#181311" letter-spacing="4">THE APARTMENT BREW CO.</text>
    <text x="40" y="75" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#C4884D">Logo Anatomy, Construction Grid &amp; Dimension Specifications (Horizontal Lockup Standard)</text>
    <line x1="40" y1="90" x2="1160" y2="90" stroke="#181311" stroke-width="1.5" stroke-opacity="0.2"/>
    
    <!-- Main Card -->
    <rect x="40" y="110" width="1120" height="380" rx="12" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1.2"/>
    <!-- Grid -->
    <g stroke="#EAE3D6" stroke-width="0.8" stroke-dasharray="3,3">
        <line x1="60" y1="120" x2="60" y2="480"/><line x1="100" y1="120" x2="100" y2="480"/><line x1="140" y1="120" x2="140" y2="480"/><line x1="180" y1="120" x2="180" y2="480"/><line x1="220" y1="120" x2="220" y2="480"/><line x1="260" y1="120" x2="260" y2="480"/><line x1="300" y1="120" x2="300" y2="480"/><line x1="340" y1="120" x2="340" y2="480"/><line x1="380" y1="120" x2="380" y2="480"/><line x1="420" y1="120" x2="420" y2="480"/><line x1="460" y1="120" x2="460" y2="480"/><line x1="500" y1="120" x2="500" y2="480"/><line x1="540" y1="120" x2="540" y2="480"/><line x1="580" y1="120" x2="580" y2="480"/><line x1="620" y1="120" x2="620" y2="480"/><line x1="660" y1="120" x2="660" y2="480"/><line x1="700" y1="120" x2="700" y2="480"/><line x1="740" y1="120" x2="740" y2="480"/><line x1="780" y1="120" x2="780" y2="480"/><line x1="820" y1="120" x2="820" y2="480"/><line x1="860" y1="120" x2="860" y2="480"/><line x1="900" y1="120" x2="900" y2="480"/><line x1="940" y1="120" x2="940" y2="480"/><line x1="980" y1="120" x2="980" y2="480"/><line x1="1020" y1="120" x2="1020" y2="480"/><line x1="1060" y1="120" x2="1060" y2="480"/><line x1="1100" y1="120" x2="1100" y2="480"/><line x1="1140" y1="120" x2="1140" y2="480"/>
        <line x1="50" y1="130" x2="1150" y2="130"/><line x1="50" y1="165" x2="1150" y2="165"/><line x1="50" y1="200" x2="1150" y2="200"/><line x1="50" y1="235" x2="1150" y2="235"/><line x1="50" y1="270" x2="1150" y2="270"/><line x1="50" y1="305" x2="1150" y2="305"/><line x1="50" y1="340" x2="1150" y2="340"/><line x1="50" y1="375" x2="1150" y2="375"/><line x1="50" y1="410" x2="1150" y2="410"/><line x1="50" y1="445" x2="1150" y2="445"/>
    </g>
    
    <!-- Horizontal Logo Standard Lockup -->
    <path d="M 168.1 396.9 L 311.9 396.9 L 311.9 271.9 L 240.0 178.1 L 168.1 271.9 Z" fill="none" stroke="#181311" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-3 240 334.375)">
        <ellipse cx="240.0" cy="334.4" rx="28.8" ry="38.8" fill="none" stroke="#181311" stroke-width="4.3" stroke-linecap="round"/>
        <path d="M 240.0 301.4 C 246.9 320.8, 233.1 353.8, 240.0 367.3" fill="none" stroke="#181311" stroke-width="4.0" stroke-linecap="round"/>
    </g>
    
    <line x1="360" y1="210" x2="360" y2="390" stroke="#C4884D" stroke-width="2.5"/>
    <text x="390" y="270" font-family="'DejaVu Sans', sans-serif" font-size="34" font-weight="bold" fill="#181311" letter-spacing="4">THE APARTMENT</text>
    <text x="390" y="315" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#C4884D" letter-spacing="6">BREW CO.</text>
    <text x="390" y="355" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#181311" fill-opacity="0.85" letter-spacing="2.5">FLASH-CHILLED &amp; CRAFT SPECIALTY COFFEE</text>
    <text x="390" y="380" font-family="'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#9E472A" letter-spacing="2">EST. 2026 • GURUGRAM</text>
    
    <!-- Callouts -->
    <rect x="110" y="160" width="980" height="270" rx="8" fill="none" stroke="#9B5DE5" stroke-width="1.2" stroke-dasharray="6,6"/>
    <text x="1080" y="150" font-family="'DejaVu Sans', sans-serif" font-size="10" font-weight="bold" fill="#9B5DE5" text-anchor="end">Clear Space Exclusion Zone (≥ 0.5X)</text>
    <text x="600" y="470" font-family="'DejaVu Sans', sans-serif" font-size="12" font-weight="bold" fill="#2E2A27" text-anchor="middle">STANDARD HORIZONTAL LOCKUP RATIO: 2.83 : 1 (850px × 300px)</text>
    
    <!-- Bottom 3 Info Boxes -->
    <rect x="40" y="510" width="350" height="260" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1"/>
    <text x="60" y="540" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#181311">1. EMBLEM ANATOMY</text>
    <text x="60" y="570" font-family="'DejaVu Sans', sans-serif" font-size="10.5" fill="#2E2A27">
        <tspan x="60" dy="0">• Monoline 4.5pt stroke with rounded joins.</tspan>
        <tspan x="60" dy="20">• 45° Equilateral Gable: Home micro-brewery.</tspan>
        <tspan x="60" dy="20">• Coffee Bean with S-Curve Cleft (-3° tilt):</tspan>
        <tspan x="60" dy="18">  Represents hot extraction &amp; flash chill.</tspan>
        <tspan x="60" dy="20">• Golden Ratio balance between frame and seed.</tspan>
    </text>
    
    <rect x="425" y="510" width="350" height="260" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1"/>
    <text x="445" y="540" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#181311">2. DIMENSIONS &amp; CLEAR SPACE</text>
    <text x="445" y="570" font-family="'DejaVu Sans', sans-serif" font-size="10.5" fill="#2E2A27">
        <tspan x="445" dy="0">• Aspect Ratio: 14 : 5.5 (2.83 : 1 ratio).</tspan>
        <tspan x="445" dy="20">• Standard Dimensions: 850px × 300px.</tspan>
        <tspan x="445" dy="20">• Unit Scale (X): Height of internal bean.</tspan>
        <tspan x="445" dy="20">• Mandatory Clear Space: ≥ 0.5X on all sides.</tspan>
        <tspan x="445" dy="20">• Min Digital: 120px | Min Print: 25mm.</tspan>
    </text>
    
    <rect x="810" y="510" width="350" height="260" rx="10" fill="#FAF6EE" stroke="#D9D2C5" stroke-width="1"/>
    <text x="830" y="540" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#181311">3. COLOR HIERARCHY</text>
    <text x="830" y="570" font-family="'DejaVu Sans', sans-serif" font-size="10.5" fill="#2E2A27">
        <tspan x="830" dy="0">• Espresso Charcoal (#181311): Primary type.</tspan>
        <tspan x="830" dy="20">• Warm Oat Cream (#FAF6EE): Base parchment.</tspan>
        <tspan x="830" dy="20">• Roast Amber (#C4884D): "BREW CO." accent.</tspan>
        <tspan x="830" dy="20">• Specialty Terracotta (#9E472A): Terroir tag.</tspan>
        <tspan x="830" dy="20">• High-contrast dark edition supported.</tspan>
    </text>
</svg>